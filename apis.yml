aid: twin-health
name: Twin Health
description: 'Twin Health is a metabolic health company whose Whole Body Digital
  Twin uses AI and real-time data from sensors and wearables to deliver personalized
  daily guidance on food, sleep, activity, and stress, paired with clinician-led
  care teams, to address type 2 diabetes, prediabetes, and obesity. The service
  is sold through employers and health plans, with members served via the Twin
  Health mobile apps and the MyCare by Twin portal. The company publishes no public
  developer API, portal, or machine-readable surface, but does publish a SOC 2
  Type 2 / HIPAA security-and-compliance program and a responsible disclosure
  policy. Surfaced as a portfolio company of iconiq-capital.'
